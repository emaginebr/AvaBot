services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avabot-api
    restart: unless-stopped
    expose:
      - "80"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__AvaBotContext: ${AVABOT_CONNECTION_STRING}
      # A chave OpenAI nao e mais variavel de ambiente: cada agente guarda a sua,
      # cifrada no banco e cadastrada no painel. Usa POWERBI_SECRET_ENCRYPTION_KEY.
      Auth__Username: ${AVABOT_USERNAME}
      Auth__Password: ${AVABOT_PASSWORD}
      Auth__JwtSecret: ${AVABOT_JWT_SECRET}
      WppConnect__SecretKey: ${WPP_SECRET_KEY}
      PowerBI__SecretEncryptionKey: ${POWERBI_SECRET_ENCRYPTION_KEY}
    networks:
      - emagine-network

networks:
  emagine-network:
    external: true
