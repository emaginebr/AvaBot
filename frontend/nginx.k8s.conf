# nginx da imagem do frontend no Kubernetes: só serve a SPA. As rotas /api chegam direto do
# ingress à API (deploy/k8s/avabot/ingress*.yaml); o nginx.conf ao lado é do ambiente local.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # widget.js é embutido em sites de terceiros: sempre a versão mais recente.
    location = /widget.js {
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    # Arquivos com hash no nome: cache longo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
