# Rotas de conexão longa: WebSocket do chat (/api/ws) e MCP via HTTP streamable/SSE (/api/mcp).
# Sem buffer e com timeouts de 1 h. A Cloudflare corta requisições HTTP sem resposta por mais de
# ~100 s (o WebSocket não sofre esse corte depois do upgrade).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: avabot-stream
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-Tenant-Id, X-Device-Fingerprint, User-Agent, Mcp-Session-Id, Mcp-Protocol-Version"
    nginx.ingress.kubernetes.io/cors-max-age: "86400"
spec:
  ingressClassName: nginx
  rules:
    - host: avabot.net
      http:
        paths:
          - path: /api/ws
            pathType: Prefix
            backend:
              service:
                name: avabot-api
                port:
                  number: 8080
          - path: /api/mcp
            pathType: Prefix
            backend:
              service:
                name: avabot-api
                port:
                  number: 8080
