services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avabot-api
    ports:
      - "${APP_PORT:-5000}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__AvaBotContext: ${CONNECTION_STRING}
      # A chave OpenAI nao e mais variavel de ambiente: cada agente guarda a sua,
      # cifrada no banco e cadastrada no painel. Usa POWERBI_SECRET_ENCRYPTION_KEY.
      Auth__Username: ${AVABOT_USERNAME}
      Auth__Password: ${AVABOT_PASSWORD}
      Auth__JwtSecret: ${AVABOT_JWT_SECRET}
      WppConnect__SecretKey: ${WPP_SECRET_KEY}
      PowerBI__SecretEncryptionKey: ${POWERBI_SECRET_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - emagine-network

  postgres:
    image: postgres:17-alpine
    container_name: avabot-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - emagine-network

  wppconnect:
    build:
      context: .
      dockerfile: wppconnect.Dockerfile
    image: avabot/wppconnect:latest
    container_name: avabot-wppconnect
    command: ["--secretKey", "${WPP_SECRET_KEY}", "--port", "21465"]
    ports:
      - "21465:21465"
    volumes:
      - wpp_tokens:/usr/src/wpp-server/tokens
    restart: unless-stopped
    networks:
      - emagine-network

volumes:
  postgres_data:
  wpp_tokens:

networks:
  emagine-network:
    driver: bridge
